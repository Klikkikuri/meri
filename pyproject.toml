[project]
name = "meri"
version = "0.1.0"
description = "Meri 🌊 – Klikkikuri backend service for news title unsensationalizer"
authors = [
	{name="Teemu Autto", email="klikkikuri@teemu.rautakuu.org"},
	{name="Juho Tarkkanen", email="juho.tarkkanen@hotmail.fi"},
	{name="Taija Kolehmainen", email="taija.s.kolehmainen@jyu.fi"}
]
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE.txt"]
dependencies = [
    "click>=8.1.8",
    "fastfeedparser>=0.4.4",
    "haystack-ai>=2.9.0",
    "htmldate[speed]>=1.9.3",
    "httpx>=0.28.1",
    "jinja2-time>=0.2.0",
    "langdetect>=1.0.9",
    "lxml[html-clean]>=5.3.0",
    "markdownify>=0.14.1",
    "model2vec>=0.6.0",
    "niitti[all]",
    "openrouter-haystack>=0.4.0",
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "platformdirs>=4.3.6",
    "pycurl>=7.45.4",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "pydantic-yaml>=1.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "sentry-sdk>=2.48.0",
    "structlog>=25.1.0",
    "suola",
    "tenacity>=9.0.0",
    "trafilatura>=2.0.0",
    "ultimate-sitemap-parser>=1.6.0",
    "url-normalize>=1.4.3",
    "wrapt>=1.17.2",
]
requires-python = ">=3.12"

[project.urls]
homepage = "https://github.com/Klikkikuri"
source = "https://github.com/Klikkikuri/meri"

[project.scripts]
meri = "meri.__main__:cli"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    # The pycodestyle and pyflakes rules that ruff 0.16 dropped from its default set, plus line length.
    "E4", "E7", "E501", "F", "W"
]
# Rules that stay off. Every other rule names a defect to fix, not a rule to disable.
ignore = [
    "E701",    # one-line guard clauses: `if x: continue`
    "ISC001",  # documented as incompatible with the formatter
    "PLC0415", # lazy imports are deliberate; see the comment in meri/cli/feedback.py
    "PLR0913", # argument-count thresholds, not defects
    "PLR0917",
    "S",       # the bandit hook is the security check; S101 would flag every assert in tests
    "TRY003",  # would require one custom exception class per message
]
# The en dash is part of the project's prose: "Meri 🌊 – Common library for Meri projects."
allowed-confusables = ["–"]

[tool.uv]
dev-dependencies = [
    "black>=24.10.0",
    "ruff>=0.17.3",
    "bandit>=1.9.4",
    "debugpy>=1.8.12",
    "isort>=5.13.2",
    "requests-cache>=1.2.1",
    "autopep8>=2.3.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "rich>=13.9.4",
    "rich-click>=1.8.8",
    "pre-commit>=4.7.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pandas>=3.0.5",
]
[tool.uv.sources]
suola = [
    { url = "https://github.com/Klikkikuri/suola/releases/download/v0.7.0/suola-0.7.0-py3-none-any.whl" },
    #{ path = "packages/suola/python" },
    #{ workspace = true }
]
niitti = { workspace = true }
#suola = { workspace = true }
#karikko = { workspace = true }
#meri = { path = "./src/meri" }

[tool.uv.workspace]
# `packages/sulku` is a submodule but deliberately NOT a member: meri only speaks to Sulku over HTTP
# (`meri.sulku.service`), and membership would force one niitti resolution across both projects — sulku is its
# own uv workspace and pins niitti as a git dependency. `scripts/sync-niitti.sh` moves both to one revision.
members = ["packages/niitti"]
#members = ["packages/suola/python"]
#members = ["src/*"]
# Exclude self from workspace
#exclude = ["src/meri"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
otel = [
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-click>=0.65b0",
    "opentelemetry-instrumentation-jinja2>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    "opentelemetry-instrumentation-threading>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
    # Backs niitti's EXTRA_RESOURCE_DETECTOR container detector.
    "opentelemetry-resource-detector-containerid>=0.65b0",
    "sentry-sdk[opentelemetry-otlp]>=2.48.0",
]
logging = [
    "structlog>=25.1.0",
]
tracing = [
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "sentry-sdk>=2.48.0",
]
dev = [
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
# Confine collection to meri's own tests: `packages/` holds submodules (sulku, niitti, rahti, suola)
# that are separate projects with their own dependencies and test suites.
testpaths = ["tests"]
