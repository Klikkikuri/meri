default_language_version:
  python: python3.12

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-yaml
    - id: check-json
      exclude: '.devcontainer/devcontainer.json'
    - id: check-toml
    - id: check-added-large-files
    - id: detect-private-key
    - id: check-ast
    - id: end-of-file-fixer
    - id: trailing-whitespace

# Security checks
#
# bandit, ruff and uv are the binaries in the project virtual environment (see the dev dependencies
# in pyproject.toml) and in the Dockerfile. pre-commit does not build an isolated environment for
# them, so a hook and `uv run <tool>` always use the same version.
- repo: local
  hooks:
    - id: bandit
      name: bandit
      entry: bandit
      language: system
      types: [python]
      args: ["--skip=B101"]  # Skip assert statement check

    # Run the linter.
    - id: ruff-check
      name: ruff check
      entry: ruff check --force-exclude
      language: system
      types_or: [python, pyi, jupyter]
      require_serial: true

    - id: uv-lock
      name: uv-lock
      entry: uv lock
      language: system
      files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
      pass_filenames: false
      require_serial: true
