[project]
name = "niitti"
version = "0.1.0"
description = "Shared logging, tracing, and settings package for Klikkikuri services"
readme = "README.md"
authors = [
    { name = "Teemu Autto", email = "teemu@rautakuu.org" }
]
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "sentry-sdk>=2.48.0",
    "structlog>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
logging = [
    "structlog>=25.1.0",
]
tracing = [
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "sentry-sdk>=2.48.0",
]
settings = [
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
]
